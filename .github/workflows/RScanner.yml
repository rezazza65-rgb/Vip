name: Proxy Scanner & Config Generator

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */24 * * *'

jobs:
  scan-and-generate:
    runs-on: ubuntu-latest
    name: Scan proxies and generate configs
    timeout-minutes: 90

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          config_generator -> config_generator/target

    # ========================================
    # Phase 0: Initialize Directory Structure
    # ========================================
    - name: Initialize Directory Structure
      run: |
        echo "🏗 Initializing directory structure..."
        
        # Create main directories
        mkdir -p sub/configs/qr_codes
        mkdir -p sub/logs
        
        # Check if configs directory is already tracked in Git
        if git ls-files --error-unmatch sub/configs/.gitkeep >/dev/null 2>&1; then
          echo "✅ Directory structure already exists in repository"
        else
          echo "🆕 First run detected - creating directory structure"
          
          # Create .gitkeep to ensure directory is tracked
          echo "# This file ensures the configs directory structure is maintained in Git" > sub/configs/.gitkeep
          echo "# Config generator will populate this directory with output files" >> sub/configs/.gitkeep
          
          # Create README for the configs directory
          echo "# Configuration Files Directory" > sub/configs/README.md
          echo "" >> sub/configs/README.md
          echo "This directory contains automatically generated proxy configurations." >> sub/configs/README.md
          echo "" >> sub/configs/README.md
          echo "## Files Generated" >> sub/configs/README.md
          echo "" >> sub/configs/README.md
          echo "- \`subscription.txt\` - Base64 encoded subscription link" >> sub/configs/README.md
          echo "- \`configs.json\` - Complete configuration data" >> sub/configs/README.md
          echo "- \`config_links.txt\` - All working configuration links" >> sub/configs/README.md
          echo "- \`vless_configs.txt\` - VLESS protocol configurations" >> sub/configs/README.md
          echo "- \`vmess_configs.txt\` - VMess protocol configurations" >> sub/configs/README.md
          echo "- \`trojan_configs.txt\` - Trojan protocol configurations" >> sub/configs/README.md
          echo "- \`shadowsocks_configs.txt\` - Shadowsocks protocol configurations" >> sub/configs/README.md
          echo "- \`statistics.txt\` - Performance statistics" >> sub/configs/README.md
          echo "- \`qr_codes/\` - QR codes for mobile device setup" >> sub/configs/README.md
          echo "" >> sub/configs/README.md
          echo "## Auto-Generated" >> sub/configs/README.md
          echo "" >> sub/configs/README.md
          echo "These files are automatically generated by the GitHub Actions workflow." >> sub/configs/README.md
          
          # Add and commit directory structure
          git config --global user.name "NET-Sentinel Bot"
          git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"
          git add sub/configs/.gitkeep sub/configs/README.md
          git commit -m "🏗 Initialize configs directory structure" || echo "No commit needed"
          
          git push origin main || echo "⚠️ Push failed, will retry at end"
        fi
        
        # Always ensure subdirectories exist (idempotent operation)
        mkdir -p sub/configs/qr_codes
        
        echo ""
        echo "📋 Directory structure:"
        ls -la sub/ 2>/dev/null | grep -v "^total" | tail -n +2 || echo "  (empty)"
        echo ""
        ls -la sub/configs/ 2>/dev/null | grep -v "^total" | tail -n +2 || echo "  (empty)"
        echo ""
        echo "✅ Directory structure is ready"

    # ========================================
    # Phase 1: Scan Proxies
    # ========================================
    - name: Build Scanner (Release)
      run: cargo build --release
      continue-on-error: false

    - name: Give Execute Permission to Scanner
      run: chmod +x ./target/release/RScanner || chmod +x ./target/release/rscanner || true

    - name: Run Proxy Scanner
      run: |
        echo "🔍 Starting proxy scanner..."
        if [ -f ./target/release/RScanner ]; then
          ./target/release/RScanner
        elif [ -f ./target/release/rscanner ]; then
          ./target/release/rscanner
        else
          echo "❌ Scanner binary not found"
          exit 1
        fi
        
        # Verify scanner output was created
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          FILESIZE=$(stat -f%z "sub/ProxyIP-Daily.md" 2>/dev/null || stat -c%s "sub/ProxyIP-Daily.md" 2>/dev/null)
          echo "✅ Scanner output created: sub/ProxyIP-Daily.md (${FILESIZE} bytes)"
          
          # Show preview of scanner output
          echo ""
          echo "📄 Scanner output preview (first 20 lines):"
          head -n 20 sub/ProxyIP-Daily.md
          echo ""
        else
          echo "⚠️ Scanner output file not created"
        fi
      continue-on-error: true

    # ========================================
    # Phase 2: Generate Configurations
    # ========================================
    - name: Build Config Generator
      working-directory: config_generator
      run: |
        echo "🔨 Building config generator..."
        cargo build --release --verbose
        
        if [ -f target/release/config-generator ]; then
          echo "✅ Config generator built successfully"
          ls -lh target/release/config-generator
        else
          echo "❌ Config generator binary not found"
          exit 1
        fi
      continue-on-error: false

    - name: Give Execute Permission to Config Generator
      run: chmod +x ./config_generator/target/release/config-generator

    - name: Run Config Generator
      run: |
        echo "⚙️ Starting config generator..."
        echo ""
        
        # Show current directory structure before running
        echo "📁 Current directory structure:"
        ls -la sub/ 2>/dev/null || echo "sub/ directory not found"
        echo ""
        
        # Run the config generator with detailed output
        ./config_generator/target/release/config-generator
        
        echo ""
        echo "📁 Output directory structure after generation:"
        ls -la sub/configs/ 2>/dev/null || echo "sub/configs/ not found"
        echo ""
      continue-on-error: true

    # ========================================
    # Phase 2.5: Ensure All Required Files Exist
    # ========================================
    - name: Ensure Output Files Exist
      run: |
        echo "📝 Checking and creating output files if needed..."
        echo ""
        
        # Create output directory if it doesn't exist
        mkdir -p sub/configs/qr_codes
        
        # Get current timestamp
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if ProxyIP-Daily.md exists and count proxies
        PROXY_COUNT=0
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
        fi
        
        echo "📊 Found $PROXY_COUNT live proxies in scanner output"
        echo ""
        
        # subscription.txt - Empty base64 if no configs
        if [ ! -f "sub/configs/subscription.txt" ]; then
          echo "📄 Creating empty subscription.txt"
          echo "" | base64 > sub/configs/subscription.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/subscription.txt" 2>/dev/null || stat -c%s "sub/configs/subscription.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/subscription.txt (${FILESIZE} bytes)"
        fi
        
        # configs.json - Empty JSON structure
        if [ ! -f "sub/configs/configs.json" ]; then
          echo "📄 Creating empty configs.json"
          echo "{" > sub/configs/configs.json
          echo "  \"subscription_link\": \"\"," >> sub/configs/configs.json
          echo "  \"configs\": []," >> sub/configs/configs.json
          echo "  \"statistics\": {" >> sub/configs/configs.json
          echo "    \"total_configs\": 0," >> sub/configs/configs.json
          echo "    \"working_configs\": 0," >> sub/configs/configs.json
          echo "    \"failed_configs\": 0," >> sub/configs/configs.json
          echo "    \"success_rate\": 0.0," >> sub/configs/configs.json
          echo "    \"average_response_time_ms\": 0.0," >> sub/configs/configs.json
          echo "    \"fastest_response_time_ms\": null," >> sub/configs/configs.json
          echo "    \"slowest_response_time_ms\": null" >> sub/configs/configs.json
          echo "  }," >> sub/configs/configs.json
          echo "  \"generated_at\": \"${TIMESTAMP}\"" >> sub/configs/configs.json
          echo "}" >> sub/configs/configs.json
        else
          FILESIZE=$(stat -f%z "sub/configs/configs.json" 2>/dev/null || stat -c%s "sub/configs/configs.json" 2>/dev/null)
          echo "✓ Already exists: sub/configs/configs.json (${FILESIZE} bytes)"
        fi
        
        # config_links.txt
        if [ ! -f "sub/configs/config_links.txt" ]; then
          echo "📄 Creating: sub/configs/config_links.txt"
          echo "# No working configurations available yet" > sub/configs/config_links.txt
          echo "# Run workflow again when proxies are detected" >> sub/configs/config_links.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/config_links.txt" 2>/dev/null || stat -c%s "sub/configs/config_links.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/config_links.txt (${FILESIZE} bytes)"
        fi
        
        # vless_configs.txt
        if [ ! -f "sub/configs/vless_configs.txt" ]; then
          echo "📄 Creating: sub/configs/vless_configs.txt"
          echo "# No VLESS configurations available" > sub/configs/vless_configs.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/vless_configs.txt" 2>/dev/null || stat -c%s "sub/configs/vless_configs.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/vless_configs.txt (${FILESIZE} bytes)"
        fi
        
        # vmess_configs.txt
        if [ ! -f "sub/configs/vmess_configs.txt" ]; then
          echo "📄 Creating: sub/configs/vmess_configs.txt"
          echo "# No VMess configurations available" > sub/configs/vmess_configs.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/vmess_configs.txt" 2>/dev/null || stat -c%s "sub/configs/vmess_configs.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/vmess_configs.txt (${FILESIZE} bytes)"
        fi
        
        # trojan_configs.txt
        if [ ! -f "sub/configs/trojan_configs.txt" ]; then
          echo "📄 Creating: sub/configs/trojan_configs.txt"
          echo "# No Trojan configurations available" > sub/configs/trojan_configs.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/trojan_configs.txt" 2>/dev/null || stat -c%s "sub/configs/trojan_configs.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/trojan_configs.txt (${FILESIZE} bytes)"
        fi
        
        # shadowsocks_configs.txt
        if [ ! -f "sub/configs/shadowsocks_configs.txt" ]; then
          echo "📄 Creating: sub/configs/shadowsocks_configs.txt"
          echo "# No Shadowsocks configurations available" > sub/configs/shadowsocks_configs.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/shadowsocks_configs.txt" 2>/dev/null || stat -c%s "sub/configs/shadowsocks_configs.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/shadowsocks_configs.txt (${FILESIZE} bytes)"
        fi
        
        # statistics.txt
        if [ ! -f "sub/configs/statistics.txt" ]; then
          echo "📄 Creating statistics.txt"
          echo "Configuration Test Statistics" > sub/configs/statistics.txt
          echo "==============================" >> sub/configs/statistics.txt
          echo "" >> sub/configs/statistics.txt
          echo "Generated at: ${TIMESTAMP}" >> sub/configs/statistics.txt
          echo "" >> sub/configs/statistics.txt
          echo "Total Configs Tested: 0" >> sub/configs/statistics.txt
          echo "Working Configs: 0" >> sub/configs/statistics.txt
          echo "Failed Configs: 0" >> sub/configs/statistics.txt
          echo "Success Rate: 0.00%" >> sub/configs/statistics.txt
          echo "" >> sub/configs/statistics.txt
          echo "Performance Metrics:" >> sub/configs/statistics.txt
          echo "- Average Response Time: 0.00 ms" >> sub/configs/statistics.txt
          echo "- Fastest Response Time: N/A" >> sub/configs/statistics.txt
          echo "- Slowest Response Time: N/A" >> sub/configs/statistics.txt
          echo "" >> sub/configs/statistics.txt
          echo "Note: No live proxies were detected in the last scan." >> sub/configs/statistics.txt
          echo "The system is ready to process proxies once they are discovered." >> sub/configs/statistics.txt
        else
          FILESIZE=$(stat -f%z "sub/configs/statistics.txt" 2>/dev/null || stat -c%s "sub/configs/statistics.txt" 2>/dev/null)
          echo "✓ Already exists: sub/configs/statistics.txt (${FILESIZE} bytes)"
        fi
        
        # Create README.txt in qr_codes directory
        if [ ! -f "sub/configs/qr_codes/README.txt" ]; then
          echo "QR Code Directory" > sub/configs/qr_codes/README.txt
          echo "=================" >> sub/configs/qr_codes/README.txt
          echo "" >> sub/configs/qr_codes/README.txt
          echo "No QR codes available yet." >> sub/configs/qr_codes/README.txt
          echo "QR codes will be generated automatically when working proxy configurations are detected." >> sub/configs/qr_codes/README.txt
        fi
        
        echo ""
        echo "✅ All required output files are present"
        echo ""
        echo "📊 File summary:"
        ls -lh sub/configs/*.txt sub/configs/*.json 2>/dev/null | awk '{print "   " $9 " (" $5 ")"}'
        echo ""

    # ========================================
    # Phase 3: Commit and Push Results
    # ========================================
    - name: Prepare Git Configuration
      run: |
        git config --global user.name "NET-Sentinel Bot"
        git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"

    - name: Stage All Changes
      run: |
        echo "📦 Staging files for commit..."
        echo ""
        
        # Add scanner output if it exists
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          git add sub/ProxyIP-Daily.md
          echo "✓ Staged: sub/ProxyIP-Daily.md"
        else
          echo "⚠️ Warning: sub/ProxyIP-Daily.md not found"
        fi
        
        # Add .gitkeep and README if they exist
        git add sub/configs/.gitkeep 2>/dev/null || true
        git add sub/configs/README.md 2>/dev/null || true
        
        # Force add all config output files
        echo ""
        echo "🔍 Adding all config output files..."
        
        # Add all files in configs directory - be explicit
        git add -f sub/configs/subscription.txt 2>/dev/null || true
        git add -f sub/configs/configs.json 2>/dev/null || true
        git add -f sub/configs/config_links.txt 2>/dev/null || true
        git add -f sub/configs/vless_configs.txt 2>/dev/null || true
        git add -f sub/configs/vmess_configs.txt 2>/dev/null || true
        git add -f sub/configs/trojan_configs.txt 2>/dev/null || true
        git add -f sub/configs/shadowsocks_configs.txt 2>/dev/null || true
        git add -f sub/configs/statistics.txt 2>/dev/null || true
        
        # Add QR codes directory
        git add -f sub/configs/qr_codes/* 2>/dev/null || true
        
        # Count staged files
        FOUND_TXT=$(git diff --cached --name-only 2>/dev/null | grep -c "\.txt$" || echo "0")
        FOUND_JSON=$(git diff --cached --name-only 2>/dev/null | grep -c "\.json$" || echo "0")
        FOUND_MD=$(git diff --cached --name-only 2>/dev/null | grep -c "\.md$" || echo "0")
        
        echo "✓ Found and staged $FOUND_TXT text file(s)"
        echo "✓ Found and staged $FOUND_JSON JSON file(s)"
        echo "✓ Found and staged $FOUND_MD markdown file(s)"
        
        # Display staging summary
        echo ""
        echo "📊 Staging Summary:"
        TOTAL_STAGED=$(git diff --cached --name-only 2>/dev/null | wc -l)
        if [ "$TOTAL_STAGED" -gt 0 ]; then
          echo "✅ Total files staged: $TOTAL_STAGED"
          echo ""
          echo "Staged files:"
          git diff --cached --name-only | sed 's/^/  - /'
        else
          echo "ℹ️ No new files to stage (all files up to date)"
        fi

    - name: Commit Changes
      run: |
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "📝 No changes to commit"
          echo "has_changes=false" >> $GITHUB_ENV
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          
          # Count proxies for commit message
          PROXY_COUNT=0
          if [ -f "sub/ProxyIP-Daily.md" ]; then
            PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          fi
          
          # Count working configs
          WORKING_CONFIGS=0
          if [ -f "sub/configs/configs.json" ]; then
            WORKING_CONFIGS=$(grep -o '"working_configs": [0-9]*' sub/configs/configs.json | grep -o '[0-9]*' || echo "0")
          fi
          
          echo "📝 Committing $CHANGED_FILES changed file(s)"
          echo ""
          
          git commit -m "Auto-update: Proxy scan and config generation - $TIMESTAMP - Proxies: $PROXY_COUNT - Working configs: $WORKING_CONFIGS"
          
          echo "has_changes=true" >> $GITHUB_ENV
          echo "✅ Commit created successfully"
        fi

    - name: Amend Commit with Diana-Cl Identity
      if: env.has_changes == 'true'
      run: |
        echo "✏️ Amending commit with Diana-Cl identity..."
        git -c committer.name="Diana-Cl" \
            -c committer.email="135276904+Diana-Cl@users.noreply.github.com" \
            commit --amend --no-edit
        echo "✅ Commit amended"

    - name: Push Changes
      if: env.has_changes == 'true'
      run: |
        echo "🚀 Pushing changes to repository..."
        git push origin main --force
        echo "✅ Changes pushed successfully"
      continue-on-error: true

    # ========================================
    # Phase 4: Post-Processing & Summary
    # ========================================
    - name: Display Workflow Summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "        Workflow Summary                "
        echo "========================================"
        echo ""
        
        # Check scanner output
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          FILESIZE=$(stat -f%z "sub/ProxyIP-Daily.md" 2>/dev/null || stat -c%s "sub/ProxyIP-Daily.md" 2>/dev/null)
          echo "📡 Scanner: ✅ Success"
          echo "   - Found $PROXY_COUNT live proxies"
          echo "   - File size: ${FILESIZE} bytes"
        else
          echo "📡 Scanner: ⚠️ No output file"
        fi
        
        echo ""
        
        # Check config files status
        if [ -f "sub/configs/configs.json" ]; then
          WORKING_CONFIGS=$(grep -o '"working_configs": [0-9]*' sub/configs/configs.json | grep -o '[0-9]*' || echo "0")
          TOTAL_CONFIGS=$(grep -o '"total_configs": [0-9]*' sub/configs/configs.json | grep -o '[0-9]*' || echo "0")
          SUCCESS_RATE=$(grep -o '"success_rate": [0-9.]*' sub/configs/configs.json | grep -o '[0-9.]*' || echo "0")
          
          echo "⚙️ Config Generator: ✅ Completed"
          echo "   - Total configs tested: $TOTAL_CONFIGS"
          echo "   - Working configs: $WORKING_CONFIGS"
          echo "   - Success rate: ${SUCCESS_RATE}%"
        else
          echo "⚙️ Config Generator: ⚠️ No configs.json found"
        fi
        
        echo ""
        echo "📁 Config Files Status:"
        
        # List all expected config files with their status
        for file in subscription.txt configs.json config_links.txt vless_configs.txt vmess_configs.txt trojan_configs.txt shadowsocks_configs.txt statistics.txt; do
          if [ -f "sub/configs/$file" ]; then
            SIZE=$(stat -f%z "sub/configs/$file" 2>/dev/null || stat -c%s "sub/configs/$file" 2>/dev/null || echo "0")
            echo "   ✓ $file (${SIZE} bytes)"
          else
            echo "   ✗ $file (missing)"
          fi
        done
        
        echo ""
        
        # Check QR codes
        if [ -d "sub/configs/qr_codes" ]; then
          QR_COUNT=$(find sub/configs/qr_codes -type f -name "*.txt" 2>/dev/null | wc -l)
          if [ "$QR_COUNT" -gt 0 ]; then
            echo "📱 QR Codes: ✅ Generated ($QR_COUNT files)"
          else
            echo "📱 QR Codes: ℹ️ No QR codes (waiting for working configs)"
          fi
        fi
        
        echo ""
        echo "========================================"
        echo "  ✅ Workflow completed successfully    "
        echo "========================================"
        echo ""

    - name: Complete Job
      if: always()
      run: echo "🎉 Job execution finished"
