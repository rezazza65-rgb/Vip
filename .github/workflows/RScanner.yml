name: Proxy Scanner & Config Generator

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */24 * * *'

jobs:
  scan-and-generate:
    runs-on: ubuntu-latest
    name: Scan proxies and generate configs
    timeout-minutes: 90

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          config_generator -> config_generator/target

    # ========================================
    # Phase 0: Initialize Directory Structure
    # ========================================
    - name: Initialize Directory Structure
      run: |
        echo "🏗 Initializing directory structure..."
        
        # Create main directories
        mkdir -p sub/configs/qr_codes
        mkdir -p sub/logs
        
        # Check if configs directory is already tracked in Git
        if git ls-files --error-unmatch sub/configs/.gitkeep >/dev/null 2>&1; then
          echo "✅ Directory structure already exists in repository"
        else
          echo "🆕 First run detected - creating directory structure"
          
          # Create .gitkeep to ensure directory is tracked
          printf '%s\n' '# This file ensures the configs directory structure is maintained in Git' '# Config generator will populate this directory with output files' > sub/configs/.gitkeep
          
          # Create README for the configs directory
          cat > sub/configs/README.md << 'READMEEOF'
        # Configuration Files Directory

        This directory contains automatically generated proxy configurations.

        ## Files Generated

        - `subscription.txt` - Base64 encoded subscription link
        - `configs.json` - Complete configuration data  
        - `config_links.txt` - All working configuration links
        - `vless_configs.txt` - VLESS protocol configurations
        - `vmess_configs.txt` - VMess protocol configurations
        - `trojan_configs.txt` - Trojan protocol configurations
        - `statistics.txt` - Performance statistics
        - `qr_codes/` - QR codes for mobile device setup

        ## Auto-Generated

        These files are automatically generated by the GitHub Actions workflow.
        READMEEOF
          
          # Add and commit directory structure
          git config --global user.name "NET-Sentinel Bot"
          git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"
          git add sub/configs/.gitkeep sub/configs/README.md
          git commit -m "🏗 Initialize configs directory structure

        - Created sub/configs/ directory
        - Created sub/configs/qr_codes/ subdirectory  
        - Added .gitkeep to track empty directories
        - Added README.md with documentation

        This structure will be populated by automated workflow runs." || echo "No commit needed"
          
          git push origin main || echo "⚠️ Push failed, will retry at end"
        fi
        
        # Always ensure subdirectories exist (idempotent operation)
        mkdir -p sub/configs/qr_codes
        
        echo ""
        echo "📋 Directory structure:"
        ls -la sub/ 2>/dev/null | grep -v "^total" | tail -n +2 || echo "  (empty)"
        echo ""
        ls -la sub/configs/ 2>/dev/null | grep -v "^total" | tail -n +2 || echo "  (empty)"
        echo ""
        echo "✅ Directory structure is ready"

    # ========================================
    # Phase 1: Scan Proxies
    # ========================================
    - name: Build Scanner (Release)
      run: cargo build --release

    - name: Give Execute Permission to Scanner
      run: chmod +x ./target/release/RScanner || chmod +x ./target/release/rscanner || true

    - name: Run Proxy Scanner
      run: |
        echo "🔍 Starting proxy scanner..."
        if [ -f ./target/release/RScanner ]; then
          ./target/release/RScanner
        elif [ -f ./target/release/rscanner ]; then
          ./target/release/rscanner
        else
          echo "❌ Scanner binary not found"
          exit 1
        fi
      continue-on-error: true

    # ========================================
    # Phase 2: Generate Configurations
    # ========================================
    - name: Build Config Generator
      working-directory: config_generator
      run: cargo build --release

    - name: Give Execute Permission to Config Generator
      run: chmod +x ./config_generator/target/release/config-generator

    - name: Run Config Generator
      run: |
        echo "⚙️ Starting config generator..."
        ./config_generator/target/release/config-generator
      continue-on-error: true

    # ========================================
    # Phase 2.5: Create Empty Files if No Proxies Found
    # ========================================
    - name: Ensure Output Files Exist
      run: |
        echo "📝 Checking and creating output files if needed..."
        
        # Create output directory if it doesn't exist
        mkdir -p sub/configs/qr_codes
        
        # Function to create file if it doesn't exist
        create_if_missing() {
          local filepath="$1"
          local content="$2"
          
          if [ ! -f "$filepath" ]; then
            echo "Creating: $filepath"
            echo "$content" > "$filepath"
          else
            echo "✓ Already exists: $filepath"
          fi
        }
        
        # Get current timestamp
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if ProxyIP-Daily.md exists and count proxies
        PROXY_COUNT=0
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
        fi
        
        echo "Found $PROXY_COUNT live proxies"
        
        # subscription.txt - Empty base64 if no configs
        if [ ! -f "sub/configs/subscription.txt" ]; then
          echo "Creating empty subscription.txt"
          echo "" | base64 > sub/configs/subscription.txt
        fi
        
        # configs.json - Empty JSON structure
        if [ ! -f "sub/configs/configs.json" ]; then
          echo "Creating empty configs.json"
          cat > sub/configs/configs.json << 'JSONEOF'
        {
          "subscription_link": "",
          "configs": [],
          "statistics": {
            "total_configs": 0,
            "working_configs": 0,
            "failed_configs": 0,
            "success_rate": 0.0,
            "average_response_time_ms": 0.0,
            "fastest_response_time_ms": null,
            "slowest_response_time_ms": null
          },
          "generated_at": "TIMESTAMP_PLACEHOLDER"
        }
        JSONEOF
          # Replace timestamp placeholder
          sed -i "s/TIMESTAMP_PLACEHOLDER/$TIMESTAMP/g" sub/configs/configs.json
        fi
        
        # config_links.txt
        create_if_missing "sub/configs/config_links.txt" "# No working configurations available yet
        # Run workflow again when proxies are detected"
        
        # vless_configs.txt
        create_if_missing "sub/configs/vless_configs.txt" "# No VLESS configurations available"
        
        # vmess_configs.txt
        create_if_missing "sub/configs/vmess_configs.txt" "# No VMess configurations available"
        
        # trojan_configs.txt
        create_if_missing "sub/configs/trojan_configs.txt" "# No Trojan configurations available"
        
        # statistics.txt
        if [ ! -f "sub/configs/statistics.txt" ]; then
          echo "Creating statistics.txt"
          cat > sub/configs/statistics.txt << 'STATSEOF'
        Configuration Test Statistics
        ==============================

        Generated at: TIMESTAMP_PLACEHOLDER

        Total Configs Tested: 0
        Working Configs: 0
        Failed Configs: 0
        Success Rate: 0.00%

        Performance Metrics:
        - Average Response Time: 0.00 ms
        - Fastest Response Time: N/A
        - Slowest Response Time: N/A

        Note: No live proxies were detected in the last scan.
        The system is ready to process proxies once they are discovered.
        STATSEOF
          sed -i "s/TIMESTAMP_PLACEHOLDER/$TIMESTAMP/g" sub/configs/statistics.txt
        fi
        
        echo ""
        echo "✅ All required output files are present"
        ls -lh sub/configs/ | grep -v "^total" | tail -n +2

    # ========================================
    # Phase 3: Commit and Push Results
    # ========================================
    - name: Prepare Git Configuration
      run: |
        git config --global user.name "NET-Sentinel Bot"
        git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"

    - name: Stage All Changes
      run: |
        echo "📦 Staging files for commit..."
        echo ""
        
        # Add scanner output if it exists
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          git add sub/ProxyIP-Daily.md
          echo "✓ Staged: sub/ProxyIP-Daily.md"
        else
          echo "⚠️ Warning: sub/ProxyIP-Daily.md not found"
        fi
        
        # Add .gitkeep if modified
        if [ -f "sub/configs/.gitkeep" ]; then
          git add sub/configs/.gitkeep 2>/dev/null || true
        fi
        
        # Force add all config files (they're essential outputs)
        echo ""
        echo "🔍 Adding all config output files..."
        
        # Add all files in configs directory
        git add -f sub/configs/*.txt 2>/dev/null || true
        git add -f sub/configs/*.json 2>/dev/null || true
        git add -f sub/configs/*.md 2>/dev/null || true
        git add -f sub/configs/qr_codes/* 2>/dev/null || true
        
        # Count staged files
        FOUND_TXT=$(git diff --cached --name-only | grep -c "\.txt$" || echo "0")
        FOUND_JSON=$(git diff --cached --name-only | grep -c "\.json$" || echo "0")
        FOUND_MD=$(git diff --cached --name-only | grep -c "\.md$" || echo "0")
        
        echo "✓ Found and staged $FOUND_TXT text file(s)"
        echo "✓ Found and staged $FOUND_JSON JSON file(s)"
        echo "✓ Found and staged $FOUND_MD markdown file(s)"
        
        # Display staging summary
        echo ""
        echo "📊 Staging Summary:"
        TOTAL_STAGED=$(git diff --cached --name-only 2>/dev/null | wc -l)
        if [ "$TOTAL_STAGED" -gt 0 ]; then
          echo "✅ Total files staged: $TOTAL_STAGED"
          echo ""
          echo "Staged files:"
          git diff --cached --name-only | sed 's/^/  • /'
        else
          echo "ℹ️ No new files to stage"
        fi

    - name: Commit Changes
      run: |
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "📝 No changes to commit"
          echo "has_changes=false" >> $GITHUB_ENV
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          
          # Count proxies for commit message
          PROXY_COUNT=0
          if [ -f "sub/ProxyIP-Daily.md" ]; then
            PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          fi
          
          echo "📝 Committing $CHANGED_FILES changed file(s)"
          echo ""
          
          git commit -m "📄 Auto-update: Proxy scan & config generation

        Completed at: $TIMESTAMP (Tehran Time)

        📡 Proxy Scanner: Found $PROXY_COUNT live proxies
        ⚙️ Configuration Generator: Output files updated
        📊 Statistics and Reports: Available
        🔗 Subscription Links: Generated
        📱 QR Codes: Ready

        Generated by: NET-Sentinel Automation"
          
          echo "has_changes=true" >> $GITHUB_ENV
          echo "✅ Commit created successfully"
        fi

    - name: Amend Commit with Diana-Cl Identity
      if: env.has_changes == 'true'
      run: |
        echo "✏️ Amending commit with Diana-Cl identity..."
        git -c committer.name="Diana-Cl" \
            -c committer.email="135276904+Diana-Cl@users.noreply.github.com" \
            commit --amend --no-edit
        echo "✅ Commit amended"

    - name: Push Changes
      if: env.has_changes == 'true'
      run: |
        echo "🚀 Pushing changes to repository..."
        git push origin main --force
        echo "✅ Changes pushed successfully"
      continue-on-error: true

    # ========================================
    # Phase 4: Post-Processing
    # ========================================
    - name: Display Workflow Summary
      if: always()
      run: |
        echo ""
        echo "╔════════════════════════════════════════╗"
        echo "         Workflow Summary"
        echo "╚════════════════════════════════════════╝"
        echo ""
        
        # Check scanner output
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          echo "📡 Scanner: ✅ Success"
          echo "   └─ Found $PROXY_COUNT live proxies"
        else
          echo "📡 Scanner: ⚠️ No output file"
        fi
        
        # Check config files exist
        CONFIG_STATUS="❌ Not created"
        if [ -f "sub/configs/configs.json" ]; then
          CONFIG_STATUS="✅ Created"
        fi
        echo "⚙️ Config Files: $CONFIG_STATUS"
        
        # List all config files
        if [ -d "sub/configs" ]; then
          echo ""
          echo "📁 Config Files Status:"
          for file in subscription.txt configs.json config_links.txt vless_configs.txt vmess_configs.txt trojan_configs.txt statistics.txt; do
            if [ -f "sub/configs/$file" ]; then
              SIZE=$(stat -f%z "sub/configs/$file" 2>/dev/null || stat -c%s "sub/configs/$file" 2>/dev/null || echo "0")
              echo "   ✓ $file (${SIZE} bytes)"
            else
              echo "   ✗ $file (missing)"
            fi
          done
        fi
        
        # Check QR codes
        if [ -d "sub/configs/qr_codes" ]; then
          QR_COUNT=$(find sub/configs/qr_codes -type f 2>/dev/null | wc -l)
          if [ "$QR_COUNT" -gt 0 ]; then
            echo "📱 QR Codes: ✅ Generated ($QR_COUNT files)"
          else
            echo "📱 QR Codes: ℹ️ No QR codes (no configs to generate)"
          fi
        fi
        
        echo ""
        echo "╔════════════════════════════════════════╗"
        echo "✅ Workflow completed"
        echo "╚════════════════════════════════════════╝"

    - name: Complete Job
      if: always()
      run: echo "🎉 Job execution finished"
