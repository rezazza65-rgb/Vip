name: Proxy Scanner & Config Generator

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */24 * * *'

jobs:
  scan-and-generate:
    runs-on: ubuntu-latest
    name: Scan proxies and generate configs
    timeout-minutes: 90

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          config_generator -> config_generator/target

    # ========================================
    # Phase 1: Scan Proxies
    # ========================================
    - name: Build Scanner (Release)
      run: cargo build --release

    - name: Give Execute Permission to Scanner
      run: chmod +x ./target/release/RScanner || chmod +x ./target/release/rscanner || true

    - name: Run Proxy Scanner
      run: |
        if [ -f ./target/release/RScanner ]; then
          ./target/release/RScanner
        elif [ -f ./target/release/rscanner ]; then
          ./target/release/rscanner
        else
          echo "Scanner binary not found"
          exit 1
        fi
      continue-on-error: true

    # ========================================
    # Phase 2: Generate Configurations
    # ========================================
    - name: Build Config Generator
      working-directory: config_generator
      run: cargo build --release

    - name: Give Execute Permission to Config Generator
      run: chmod +x ./config_generator/target/release/config-generator

    - name: Run Config Generator
      run: ./config_generator/target/release/config-generator
      continue-on-error: true

    # ========================================
    # Phase 3: Commit and Push Results
    # ========================================
    - name: Prepare Git Configuration
      run: |
        git config --global user.name "NET-Sentinel Bot"
        git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"

    - name: Stage All Changes
      run: |
        # Create output directories if they don't exist
        mkdir -p sub/configs/qr_codes
        
        # Add scanner output if it exists
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          git add sub/ProxyIP-Daily.md
          echo "✓ Added scanner output"
        else
          echo "⚠ Scanner output not found"
        fi
        
        # Add config files if they exist
        if [ -d "sub/configs" ]; then
          # Add all files in configs directory
          find sub/configs -type f -name "*.txt" -exec git add -f {} \; 2>/dev/null || true
          find sub/configs -type f -name "*.json" -exec git add -f {} \; 2>/dev/null || true
          find sub/configs -type f -name "*.md" -exec git add -f {} \; 2>/dev/null || true
          
          # Add QR codes if they exist
          if [ -d "sub/configs/qr_codes" ]; then
            find sub/configs/qr_codes -type f -exec git add -f {} \; 2>/dev/null || true
          fi
          
          echo "✓ Added config files"
        else
          echo "⚠ Config directory not found - creating empty structure"
          mkdir -p sub/configs/qr_codes
          touch sub/configs/.gitkeep
          git add sub/configs/.gitkeep
        fi

    - name: Commit Changes
      run: |
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if there are any changes to commit
        if git diff --cached --quiet; then
          echo "📝 No changes to commit"
          echo "has_changes=false" >> $GITHUB_ENV
        else
          # Count changed files
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          echo "📝 Committing $CHANGED_FILES changed file(s)"
          
          git commit -m "🔄 Auto-update: Proxy scan & config generation
          
          Completed at: $TIMESTAMP (Tehran Time)
          
          📡 Proxy Scanner Results
          ⚙️  Configuration Generator Results
          📊 Statistics and Reports Updated
          🔗 Subscription Links Generated
          📱 QR Codes Created
          
          Generated by: NET-Sentinel Automation"
          
          echo "has_changes=true" >> $GITHUB_ENV
        fi

    - name: Amend Commit with Diana-Cl Identity
      if: env.has_changes == 'true'
      run: |
        git -c committer.name="Diana-Cl" \
            -c committer.email="135276904+Diana-Cl@users.noreply.github.com" \
            commit --amend --no-edit

    - name: Push Changes
      if: env.has_changes == 'true'
      run: |
        echo "🚀 Pushing changes to repository..."
        git push origin main --force
        echo "✅ Changes pushed successfully"
      continue-on-error: true

    # ========================================
    # Phase 4: Post-Processing
    # ========================================
    - name: Post Cache Rust dependencies
      if: always()
      run: echo "Caching Rust dependencies..."

    - name: Post Checkout Repository
      if: always()
      run: echo "Repository processing complete"

    - name: Complete Job
      if: always()
      run: |
        echo "✅ Job completed successfully"
        echo "📊 Check the sub/configs/ directory for results"
        echo "🔗 Subscription link available in sub/configs/subscription.txt"
        echo "📱 QR codes available in sub/configs/qr_codes/"

  # ========================================
  # Optional: Create Release
  # ========================================
  create-release:
    needs: scan-and-generate
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Create Release Tag
      id: tag
      run: |
        TAG_NAME="v$(date +'%Y%m%d-%H%M%S')"
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag_name }}
        name: Proxy Configs ${{ steps.tag.outputs.tag_name }}
        body: |
          ## 🚀 Automated Proxy Configuration Release
          
          This release contains automatically generated and tested proxy configurations.
          
          ### 📦 Included Files
          - `subscription.txt` - Subscription link
          - `configs.json` - Complete configuration data
          - `config_links.txt` - All working configs
          - Protocol-specific config files
          - Statistics and reports
          - QR codes
          
          ### 📊 Statistics
          Check `statistics.txt` for detailed metrics.
          
          ---
          *Auto-generated by NET-Sentinel Bot*
        files: |
          sub/configs/subscription.txt
          sub/configs/configs.json
          sub/configs/statistics.txt
          sub/configs/README.md
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
