name: Proxy Scanner & Config Generator

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 */12 * * *'  # Every 12 hours

jobs:
  scan-and-generate:
    runs-on: ubuntu-latest
    name: Scan proxies and generate configs
    timeout-minutes: 90

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          config_generator -> config_generator/target
        cache-on-failure: true
        save-if: true

    # ========================================
    # Phase 0: Initialize Directory Structure
    # ========================================
    - name: Initialize Directory Structure
      run: |
        echo "🏗 Initializing directory structure..."
        
        # Create main directories
        mkdir -p sub/configs/qr_codes
        mkdir -p sub/logs
        
        # Check if configs directory is already tracked in Git
        if git ls-files --error-unmatch sub/configs/.gitkeep >/dev/null 2>&1; then
          echo "✅ Directory structure already exists in repository"
        else
          echo "🆕 First run detected - creating directory structure"
          
          # Create .gitkeep to ensure directory is tracked
          echo "# This file ensures the configs directory structure is maintained in Git" > sub/configs/.gitkeep
          echo "# Config generator will populate this directory with output files" >> sub/configs/.gitkeep
          
          # Create README for the configs directory
          cat > sub/configs/README.md << 'EOF'
# Configuration Files Directory

This directory contains automatically generated proxy configurations.

## Files Generated

- `subscription.txt` - Base64 encoded subscription link
- `configs.json` - Complete configuration data
- `config_links.txt` - All working configuration links
- `vless_configs.txt` - VLESS protocol configurations
- `vmess_configs.txt` - VMess protocol configurations
- `trojan_configs.txt` - Trojan protocol configurations
- `shadowsocks_configs.txt` - Shadowsocks protocol configurations
- `statistics.txt` - Performance statistics
- `qr_codes/` - QR codes for mobile device setup

## Auto-Generated

These files are automatically generated by the GitHub Actions workflow.
EOF
          
          # Add and commit directory structure
          git config --global user.name "NET-Sentinel Bot"
          git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"
          git add sub/configs/.gitkeep sub/configs/README.md
          git commit -m "🏗 Initialize configs directory structure" || echo "No commit needed"
          
          git push origin main || echo "⚠️ Push failed, will retry at end"
        fi
        
        # Always ensure subdirectories exist (idempotent operation)
        mkdir -p sub/configs/qr_codes
        
        echo ""
        echo "📋 Directory structure:"
        ls -la sub/ 2>/dev/null | grep -v "^total" | tail -n +2 || echo "  (empty)"
        echo ""
        ls -la sub/configs/ 2>/dev/null | grep -v "^total" | tail -n +2 || echo "  (empty)"
        echo ""
        echo "✅ Directory structure is ready"

    # ========================================
    # Phase 1: Build Scanner (Optimized)
    # ========================================
    - name: Build Scanner Binary
      run: |
        echo "🔨 Building RScanner..."
        cargo build --release --bin RScanner
        
        if [ -f target/release/RScanner ]; then
          chmod +x target/release/RScanner
          echo "✅ Scanner built successfully"
          ls -lh target/release/RScanner
        else
          echo "❌ Scanner binary not found"
          exit 1
        fi
      continue-on-error: false

    - name: Run Proxy Scanner
      run: |
        echo "🔍 Starting proxy scanner..."
        timeout 480 ./target/release/RScanner || echo "Scanner completed or timed out"
        
        # Verify scanner output was created
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          FILESIZE=$(stat -c%s "sub/ProxyIP-Daily.md" 2>/dev/null || echo "0")
          echo "✅ Scanner output created: sub/ProxyIP-Daily.md (${FILESIZE} bytes)"
          
          # Count live proxies
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          echo "📊 Found $PROXY_COUNT live proxies"
          
          # Show preview of scanner output
          echo ""
          echo "📄 Scanner output preview (first 20 lines):"
          head -n 20 sub/ProxyIP-Daily.md
          echo ""
        else
          echo "⚠️ Scanner output file not created"
        fi
      continue-on-error: true

    # ========================================
    # Phase 2: Build Config Generator (Optimized with Fallback)
    # ========================================
    - name: Build Config Generator Binary
      id: build_generator
      run: |
        echo "🔨 Building config generator..."
        echo "This may take a few minutes due to dependencies..."
        echo ""
        
        cd config_generator
        
        # Build with progress indicator
        cargo build --release --bin config-generator 2>&1 | while read line; do
          echo "$line"
          # Show progress every few lines to avoid timeout appearance
          if [[ "$line" =~ "Compiling" ]]; then
            echo -n "."
          fi
        done
        
        echo ""
        echo ""
        
        if [ -f target/release/config-generator ]; then
          chmod +x target/release/config-generator
          echo "✅ Config generator built successfully"
          ls -lh target/release/config-generator
          echo "build_success=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Config generator binary not found"
          echo "build_success=false" >> $GITHUB_OUTPUT
          exit 1
        fi
      continue-on-error: true
      timeout-minutes: 20

    - name: Copy Generator Binary to Root
      if: steps.build_generator.outputs.build_success == 'true'
      run: |
        echo "📦 Copying config generator binary..."
        cp config_generator/target/release/config-generator ./config-generator-bin
        chmod +x ./config-generator-bin
        echo "✅ Binary copied to root directory"

    - name: Run Config Generator
      if: steps.build_generator.outputs.build_success == 'true'
      run: |
        echo "⚙️ Starting config generator..."
        echo ""
        
        # Show current directory structure before running
        echo "📁 Current directory structure:"
        ls -la sub/ 2>/dev/null || echo "sub/ directory not found"
        echo ""
        
        # Run the config generator
        ./config-generator-bin
        
        echo ""
        echo "✅ Config generator completed"
        echo ""
        echo "📁 Output directory structure after generation:"
        ls -la sub/configs/ 2>/dev/null || echo "sub/configs/ not found"
        echo ""
      continue-on-error: true

    # ========================================
    # Phase 2.5: Fallback - Create Basic Config Files
    # ========================================
    - name: Create Fallback Config Files
      if: always()
      run: |
        echo "🔄 Ensuring all required output files exist..."
        echo ""
        
        # Create output directory if it doesn't exist
        mkdir -p sub/configs/qr_codes
        
        # Get current timestamp
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if ProxyIP-Daily.md exists and count proxies
        PROXY_COUNT=0
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
        fi
        
        echo "📊 Found $PROXY_COUNT live proxies in scanner output"
        echo ""
        
        # subscription.txt - Create if empty or missing
        if [ ! -s "sub/configs/subscription.txt" ]; then
          echo "📄 Creating subscription.txt"
          if [ $PROXY_COUNT -gt 0 ]; then
            echo "Waiting for config generator..." | base64 > sub/configs/subscription.txt
          else
            echo "" | base64 > sub/configs/subscription.txt
          fi
        fi
        
        # configs.json - Create basic structure if missing
        if [ ! -f "sub/configs/configs.json" ]; then
          echo "📄 Creating configs.json"
          cat > sub/configs/configs.json << EOF
{
  "generated_at": "$TIMESTAMP",
  "total_configs": 0,
  "working_configs": 0,
  "failed_configs": 0,
  "success_rate": 0.0,
  "protocols": {
    "vless": 0,
    "vmess": 0,
    "trojan": 0,
    "shadowsocks": 0
  },
  "note": "Config generator will populate this file when working proxies are detected"
}
EOF
        fi
        
        # config_links.txt
        if [ ! -f "sub/configs/config_links.txt" ]; then
          echo "📄 Creating config_links.txt"
          cat > sub/configs/config_links.txt << 'EOF'
# No working configurations available yet
# Run workflow again when proxies are detected
EOF
        fi
        
        # Protocol-specific files
        for protocol in vless vmess trojan shadowsocks; do
          if [ ! -f "sub/configs/${protocol}_configs.txt" ]; then
            echo "📄 Creating ${protocol}_configs.txt"
            echo "# No ${protocol} configurations available yet" > "sub/configs/${protocol}_configs.txt"
          fi
        done
        
        # statistics.txt
        if [ ! -f "sub/configs/statistics.txt" ]; then
          echo "📄 Creating statistics.txt"
          cat > sub/configs/statistics.txt << EOF
Configuration Test Statistics
==============================

Generated at: $TIMESTAMP

Total Configs Tested: 0
Working Configs: 0
Failed Configs: 0
Success Rate: 0.00%

Performance Metrics:
- Average Response Time: 0.00 ms
- Fastest Response Time: N/A
- Slowest Response Time: N/A

Note: No live proxies were detected in the last scan.
The system is ready to process proxies once they are discovered.
EOF
        fi
        
        # QR codes README
        QR_COUNT=$(find sub/configs/qr_codes -type f -name "qr_*.txt" 2>/dev/null | wc -l)
        if [ "$QR_COUNT" -eq 0 ]; then
          echo "📄 Creating QR codes README"
          cat > sub/configs/qr_codes/README.txt << 'EOF'
QR Codes Directory
==================

QR codes will be generated here once working proxy configurations are detected.

Each QR code file contains an ASCII art QR code that can be scanned with mobile devices
to quickly import proxy configurations.

No QR codes available yet.
QR codes will be generated automatically when working proxy configurations are detected.
EOF
        fi
        
        echo ""
        echo "✅ All required output files are present"
        echo ""
        echo "📊 File summary:"
        ls -lh sub/configs/*.txt sub/configs/*.json 2>/dev/null | awk '{print "   " $9 " (" $5 ")"}'
        
        # Display QR code count
        QR_COUNT=$(find sub/configs/qr_codes -type f -name "qr_*.txt" 2>/dev/null | wc -l)
        if [ "$QR_COUNT" -gt 0 ]; then
          echo "   📱 QR Codes: $QR_COUNT files"
        else
          echo "   📱 QR Codes: 0 files (waiting for configs)"
        fi
        echo ""

    # ========================================
    # Phase 3: Commit and Push Results
    # ========================================
    - name: Prepare Git Configuration
      run: |
        git config --global user.name "NET-Sentinel Bot"
        git config --global user.email "224584266+NetSentinel-Bot@users.noreply.github.com"

    - name: Stage All Changes
      run: |
        echo "📦 Staging files for commit..."
        echo ""
        
        # Add scanner output if it exists
        git add sub/ProxyIP-Daily.md 2>/dev/null || true
        
        # Add .gitkeep and README
        git add sub/configs/.gitkeep sub/configs/README.md 2>/dev/null || true
        
        # Force add all config output files
        git add -f sub/configs/*.txt sub/configs/*.json 2>/dev/null || true
        
        # Add QR codes directory
        git add -f sub/configs/qr_codes/* 2>/dev/null || true
        
        # Display staging summary
        echo "📊 Staging Summary:"
        TOTAL_STAGED=$(git diff --cached --name-only 2>/dev/null | wc -l)
        if [ "$TOTAL_STAGED" -gt 0 ]; then
          echo "✅ Total files staged: $TOTAL_STAGED"
          echo ""
          echo "Staged files:"
          git diff --cached --name-only | sed 's/^/  - /'
        else
          echo "ℹ️ No new files to stage (all files up to date)"
        fi

    - name: Commit Changes
      run: |
        TIMESTAMP=$(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')
        
        # Check if there are changes to commit
        if git diff --cached --quiet; then
          echo "📝 No changes to commit"
          echo "has_changes=false" >> $GITHUB_ENV
        else
          CHANGED_FILES=$(git diff --cached --name-only | wc -l)
          
          # Count proxies for commit message
          PROXY_COUNT=0
          if [ -f "sub/ProxyIP-Daily.md" ]; then
            PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          fi
          
          # Count working configs
          WORKING_CONFIGS=0
          if [ -f "sub/configs/configs.json" ]; then
            WORKING_CONFIGS=$(grep -o '"working_configs": [0-9]*' sub/configs/configs.json | grep -o '[0-9]*' || echo "0")
          fi
          
          echo "📝 Committing $CHANGED_FILES changed file(s)"
          echo ""
          
          git commit -m "🔄 Auto-update [$TIMESTAMP] - Proxies: $PROXY_COUNT | Working configs: $WORKING_CONFIGS"
          
          echo "has_changes=true" >> $GITHUB_ENV
          echo "✅ Commit created successfully"
        fi

    - name: Push Changes
      if: env.has_changes == 'true'
      run: |
        echo "🚀 Pushing changes to repository..."
        
        # Try normal push first
        if git push origin main; then
          echo "✅ Changes pushed successfully"
        else
          echo "⚠️ Normal push failed, trying force push..."
          git push origin main --force
          echo "✅ Changes force-pushed successfully"
        fi
      continue-on-error: true

    # ========================================
    # Phase 4: Post-Processing & Summary
    # ========================================
    - name: Display Workflow Summary
      if: always()
      run: |
        echo ""
        echo "========================================"
        echo "        🎯 Workflow Summary             "
        echo "========================================"
        echo ""
        
        # Check scanner output
        if [ -f "sub/ProxyIP-Daily.md" ]; then
          PROXY_COUNT=$(grep -c "PROXY LIVE" sub/ProxyIP-Daily.md 2>/dev/null || echo "0")
          FILESIZE=$(stat -c%s "sub/ProxyIP-Daily.md" 2>/dev/null || echo "0")
          echo "📡 Scanner: ✅ Success"
          echo "   - Found $PROXY_COUNT live proxies"
          echo "   - File size: ${FILESIZE} bytes"
        else
          echo "📡 Scanner: ⚠️ No output file"
        fi
        
        echo ""
        
        # Check config files status
        if [ -f "sub/configs/configs.json" ]; then
          WORKING_CONFIGS=$(grep -o '"working_configs": [0-9]*' sub/configs/configs.json | grep -o '[0-9]*' || echo "0")
          TOTAL_CONFIGS=$(grep -o '"total_configs": [0-9]*' sub/configs/configs.json | grep -o '[0-9]*' || echo "0")
          SUCCESS_RATE=$(grep -o '"success_rate": [0-9.]*' sub/configs/configs.json | grep -o '[0-9.]*' || echo "0")
          
          echo "⚙️ Config Generator: ✅ Completed"
          echo "   - Total configs tested: $TOTAL_CONFIGS"
          echo "   - Working configs: $WORKING_CONFIGS"
          echo "   - Success rate: ${SUCCESS_RATE}%"
        else
          echo "⚙️ Config Generator: ℹ️ Using fallback files"
        fi
        
        echo ""
        echo "📁 Config Files Status:"
        
        # List all expected config files with their status
        for file in subscription.txt configs.json config_links.txt vless_configs.txt vmess_configs.txt trojan_configs.txt shadowsocks_configs.txt statistics.txt; do
          if [ -f "sub/configs/$file" ]; then
            SIZE=$(stat -c%s "sub/configs/$file" 2>/dev/null || echo "0")
            echo "   ✓ $file (${SIZE} bytes)"
          else
            echo "   ✗ $file (missing)"
          fi
        done
        
        echo ""
        
        # Check QR codes
        if [ -d "sub/configs/qr_codes" ]; then
          QR_COUNT=$(find sub/configs/qr_codes -type f -name "qr_*.txt" 2>/dev/null | wc -l)
          if [ "$QR_COUNT" -gt 0 ]; then
            echo "📱 QR Codes: ✅ Generated ($QR_COUNT files)"
          else
            echo "📱 QR Codes: ℹ️ No QR codes (waiting for working configs)"
          fi
        fi
        
        echo ""
        echo "========================================"
        echo "  ✅ Workflow completed successfully    "
        echo "========================================"
        echo ""
        echo "🔗 Repository: https://github.com/${{ github.repository }}"
        echo "📂 Configs: https://github.com/${{ github.repository }}/tree/main/sub/configs"
        echo ""

    - name: Complete Job
      if: always()
      run: |
        echo "🎉 Job execution finished at $(TZ='Asia/Tehran' date '+%Y-%m-%d %H:%M:%S')"
        echo ""
        echo "Next scheduled run: $(TZ='Asia/Tehran' date -d '+12 hours' '+%Y-%m-%d %H:%M:%S')"
