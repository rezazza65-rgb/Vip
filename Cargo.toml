[package]
name = "RScanner"
version = "1.0.0"
edition = "2021"
authors = ["NET-Sentinel Team"]

[[bin]]
name = "RScanner"
path = "edge/proxies-main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# HTTP client - using native-tls as per original config
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.8"

# TLS
native-tls = "0.2"
tokio-native-tls = "0.3"

# Utilities
futures = "0.3"
colored = "2.1"
rand = "0.8"
base64 = "0.22"
uuid = { version = "1.10", features = ["v4", "serde"] }
async-trait = "0.1"
url = "2.5"
regex = "1.10"
indicatif = "0.17"
urlencoding = "2.1"

# Command line parsing
clap = { version = "4.5", features = ["derive"] }

# Configuration
config = "0.14"
once_cell = "1.19"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
