[package]
name = "config-generator"
version = "1.0.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID generation
uuid = { version = "1.10", features = ["v4", "serde"] }

# Random number generation
rand = "0.8"

# Base64 encoding
base64 = "0.22"

# URL encoding
urlencoding = "2.1"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls"] }

# TLS
tokio-native-tls = "0.3"
native-tls = "0.2"

# QR code generation
qrcode = "0.14"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
