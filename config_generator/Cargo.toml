[package]
name = "config-generator"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "net", "time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.6", features = ["v4"] }
rand = "0.8"
base64 = "0.22"
urlencoding = "2.1"
qrcode = "0.14"
futures = "0.3"
tokio-native-tls = "0.3"
native-tls = "0.2"

[[bin]]
name = "config-generator"
path = "src/main.rs"
