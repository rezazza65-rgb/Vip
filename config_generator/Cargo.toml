[package]
name = "config-generator"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1.6", features = ["v4", "serde"] }

rand = "0.8"

[package]
name = "config-generator"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full", "rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

chrono = { version = "0.4", features = ["serde"] }

uuid = { version = "1.6", features = ["v4", "serde"] }

rand = "0.8"

base64 = "0.22"

urlencoding = "2.1"

qrcode = "0.14"

reqwest = { version = "0.11", features = ["json", "native-tls"] }

futures = "0.3"

tokio-native-tls = "0.3"
native-tls = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true

[lib]
name = "config_generator"
path = "src/lib.rs"

[[bin]]
name = "config-generator"
path = "src/main.rs"

